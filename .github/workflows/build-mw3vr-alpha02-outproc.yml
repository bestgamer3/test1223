name: Build MW3VR Alpha 0.2 OutProc

on:
  push:
    branches:
      - mw3vr-outproc-alpha02-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify Alpha 0.2 source
        shell: pwsh
        run: |
          $paths = @(
            "mw3vr_alpha02\source_part01.b64",
            "mw3vr_alpha02\source_part02.b64",
            "mw3vr_alpha02\source_part03.b64",
            "mw3vr_alpha02\source_part04.b64",
            "mw3vr_alpha02\source_part05.b64",
            "mw3vr_alpha02\source_part06.b64",
            "mw3vr_alpha02\source_part07.b64"
          )
          $expectedLengths = @(8000,8000,8000,8000,8000,8000,5816)
          $expectedHashes = @(
            "8c2353914c4bc7d6528b1e1af12bd856be0c4915b39c0d954ba53681312eb9f4",
            "1d459d7b634481121c87587a3bf81c0ae8090ed61e9c5a6f0ff17cf2cc6008c8",
            "86f1c06dae53f1e1591bf11ae9ce4e4df9fb9e7a5a066f4f87ffd0ffcc0d2158",
            "cb44845fb838559dd1aa294cae4d899d8efbbc63f7b3c25f0e10d22cbfd3cbf3",
            "5c2852ead1b7c702964ec1e9da4287016e559f02d8e54d71ef51d75b21280afd",
            "a78b9599359e39dc0f412d21403c93c377ba28ba1cdf8e6eb7ecde128ccab12a",
            "58c1c2a5050113bf853f697fab83683c8018286d8750e30933c67374a49140db"
          )
          $chunks = @()
          for ($i = 0; $i -lt $paths.Count; $i++) {
            if (-not (Test-Path $paths[$i])) { throw "Missing source chunk $($paths[$i])" }
            $raw = (Get-Content $paths[$i] -Raw).Trim()
            $bytes = [Text.Encoding]::ASCII.GetBytes($raw)
            $sha = [Security.Cryptography.SHA256]::Create()
            try { $hash = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace("-","").ToLowerInvariant() }
            finally { $sha.Dispose() }
            Write-Host "Chunk $($i+1): len=$($raw.Length) sha256=$hash"
            if ($raw.Length -ne $expectedLengths[$i]) { throw "Chunk $($i+1) length mismatch" }
            if ($hash -ne $expectedHashes[$i]) { throw "Chunk $($i+1) hash mismatch" }
            $chunks += $raw
          }
          $b64 = $chunks -join ""
          [IO.File]::WriteAllBytes("MW3VR_alpha02_outproc_source.zip", [Convert]::FromBase64String($b64))
          $zipHash = (Get-FileHash "MW3VR_alpha02_outproc_source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source ZIP sha256=$zipHash"
          if ($zipHash -ne "10e7b0541e14f7fe4d4a2ff399d8672f4cb068053362a625e0657abfa4554e0c") {
            throw "Source ZIP hash mismatch"
          }
          Expand-Archive "MW3VR_alpha02_outproc_source.zip" "." -Force
          if (-not (Test-Path "MW3VR_alpha02_outproc\src\host_main.cpp")) { throw "Host source missing after extraction" }

      - name: Configure Win32 MW3 bridge
        shell: cmd
        run: cmake -S MW3VR_alpha02_outproc -B build-plugin -A Win32

      - name: Build Win32 MW3 bridge
        shell: cmd
        run: cmake --build build-plugin --config Release --target mw3vr

      - name: Clone Khronos OpenXR SDK 1.1.61
        shell: cmd
        run: git clone --depth 1 --branch release-1.1.61 https://github.com/KhronosGroup/OpenXR-SDK.git openxr-sdk

      - name: Configure x64 SteamVR OpenXR host
        shell: cmd
        run: cmake -S MW3VR_alpha02_outproc -B build-host -A x64 -DFETCHCONTENT_SOURCE_DIR_OPENXR_SDK=%CD%\openxr-sdk

      - name: Build x64 SteamVR OpenXR host
        shell: cmd
        run: cmake --build build-host --config Release --target MW3VRHost

      - name: Verify binary architectures
        shell: pwsh
        run: |
          $asi = Get-ChildItem "build-plugin" -Recurse -File -Filter "MW3VR.asi" | Select-Object -First 1
          $host = Get-ChildItem "build-host" -Recurse -File -Filter "MW3VRHost.exe" | Select-Object -First 1
          if (-not $asi) { throw "MW3VR.asi not found" }
          if (-not $host) { throw "MW3VRHost.exe not found" }
          $dumpbin = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -File -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1).FullName
          if ($dumpbin) {
            & $dumpbin /headers $asi.FullName | Select-String "machine"
            & $dumpbin /headers $host.FullName | Select-String "machine"
          }
          Write-Host "ASI: $($asi.FullName)"
          Write-Host "Host: $($host.FullName)"

      - name: Fetch Ultimate ASI Loader Win32 D3D9
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/Win32-latest/d3d9-Win32.zip" -OutFile "d3d9-Win32.zip"
          Expand-Archive "d3d9-Win32.zip" "ual" -Force
          $loader = Get-ChildItem "ual" -Recurse -File -Filter "d3d9.dll" | Select-Object -First 1
          if (-not $loader) { throw "Ultimate ASI Loader d3d9.dll not found" }

      - name: Package Alpha 0.2
        shell: pwsh
        run: |
          $asi = Get-ChildItem "build-plugin" -Recurse -File -Filter "MW3VR.asi" | Select-Object -First 1
          $host = Get-ChildItem "build-host" -Recurse -File -Filter "MW3VRHost.exe" | Select-Object -First 1
          $loader = Get-ChildItem "ual" -Recurse -File -Filter "d3d9.dll" | Select-Object -First 1
          if (-not $asi -or -not $host -or -not $loader) { throw "One or more package binaries missing" }

          New-Item -ItemType Directory -Force "artifact\plugins" | Out-Null
          Copy-Item $loader.FullName "artifact\d3d9.dll"
          Copy-Item $host.FullName "artifact\MW3VRHost.exe"
          Copy-Item $asi.FullName "artifact\plugins\MW3VR.asi"
          Copy-Item "MW3VR_alpha02_outproc\mw3vr.ini" "artifact\plugins\mw3vr.ini"
          Copy-Item "MW3VR_alpha02_outproc\THIRD_PARTY_NOTICES.md" "artifact\THIRD_PARTY_NOTICES.md"

          @"
MW3VR OpenXR Alpha 0.2 - Out-of-Process SteamVR Build

IMPORTANT: Remove/replace all Alpha 0.1b/0.1c MW3VR files first.

Install directly beside iw5sp.exe:
  iw5sp.exe
  d3d9.dll                 <- Ultimate ASI Loader Win32
  MW3VRHost.exe            <- 64-bit OpenXR/SteamVR host
  plugins\MW3VR.asi        <- 32-bit MW3 D3D9 capture bridge
  plugins\mw3vr.ini

Architecture change:
- iw5sp.exe no longer loads the OpenXR loader.
- MW3VR.asi only captures the D3D9 backbuffer into shared memory.
- MW3VRHost.exe is the real 64-bit OpenXR application submitted to SteamVR.
- With ForceSteamVROpenXR=1 the host uses SteamVR's OpenXR runtime for this process only.

Launch MW3 Single Player normally. The ASI plugin starts MW3VRHost.exe automatically.
SteamVR should be started automatically when AutoStartSteamVR=1, or you can start it first.

Logs:
  mw3vr.log       = 32-bit game/bridge log
  mw3vr_host.log  = 64-bit OpenXR host log

This alpha still duplicates the same MW3 camera image to both eyes. It is not true stereo yet.
Native MW3 head-memory writes remain OFF by default.
"@ | Set-Content "artifact\QUICKSTART.txt"

          Get-FileHash "artifact\d3d9.dll" -Algorithm SHA256 | Out-File "artifact\SHA256.txt"
          Get-FileHash "artifact\MW3VRHost.exe" -Algorithm SHA256 | Out-File "artifact\SHA256.txt" -Append
          Get-FileHash "artifact\plugins\MW3VR.asi" -Algorithm SHA256 | Out-File "artifact\SHA256.txt" -Append

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: MW3VR-OpenXR-Alpha02-OutProc-SteamVR
          path: artifact
          if-no-files-found: error
