name: Build MW3VR Alpha 0.2 CV1
on:
  push:
    branches: [mw3vr-outproc-alpha02-cv1]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: pwsh
        run: |
          $p=1..14|%{"mw3vr_alpha02_small\source_part{0:D2}.b64"-f $_}
          $b=($p|%{(Get-Content $_ -Raw).Trim()})-join""
          [IO.File]::WriteAllBytes("src.zip",[Convert]::FromBase64String($b))
          $h=(Get-FileHash src.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne"10e7b0541e14f7fe4d4a2ff399d8672f4cb068053362a625e0657abfa4554e0c"){throw"Source hash mismatch: $h"}
          Expand-Archive src.zip . -Force

      - name: Apply Oculus primary-runtime rewrite
        shell: pwsh
        run: |
          $p=1..5|%{"mw3vr_oculus_patch\part{0:D2}.txt"-f $_}
          $a=@()
          for($i=0;$i-lt$p.Count;$i++){
            $r=(Get-Content $p[$i] -Raw).Replace("`r`n","`n").TrimEnd("`r","`n")
            if($i-eq$p.Count-1){$r+="`n"}
            $a+=$r
          }
          [IO.File]::WriteAllText("oculus.patch",($a-join""),[Text.UTF8Encoding]::new($false))
          git apply --check --directory=MW3VR_alpha02_outproc oculus.patch
          if($LASTEXITCODE-ne0){throw"Oculus patch check failed"}
          git apply --directory=MW3VR_alpha02_outproc oculus.patch
          if($LASTEXITCODE-ne0){throw"Oculus patch apply failed"}

      - name: Apply CV1 native-runtime rewrite
        shell: pwsh
        run: |
          $p=1..7|%{"mw3vr_cv1_patch\part{0:D2}.txt"-f $_}
          $a=@()
          for($i=0;$i-lt$p.Count;$i++){
            $r=(Get-Content $p[$i] -Raw).Replace("`r`n","`n").TrimEnd("`r","`n")
            if($i-eq$p.Count-1){$r+="`n"}
            $a+=$r
          }
          [IO.File]::WriteAllText("cv1.patch",($a-join""),[Text.UTF8Encoding]::new($false))
          Write-Host "CV1 transported patch SHA256=$((Get-FileHash cv1.patch -Algorithm SHA256).Hash)"
          git apply --check --directory=MW3VR_alpha02_outproc cv1.patch
          if($LASTEXITCODE-ne0){throw"CV1 patch check failed"}
          git apply --directory=MW3VR_alpha02_outproc cv1.patch
          if($LASTEXITCODE-ne0){throw"CV1 patch apply failed"}
          if(-not(Select-String MW3VR_alpha02_outproc\src\host_main.cpp -Pattern "EnsureServiceRunning" -Quiet)){throw"CV1 service bootstrap missing"}
          if(-not(Select-String MW3VR_alpha02_outproc\src\host_main.cpp -Pattern "OVRServer_x64.exe" -Quiet)){throw"CV1 OVRServer wait missing"}
          if(-not(Select-String MW3VR_alpha02_outproc\mw3vr.ini -Pattern "AutoStartOculusPC=1" -Quiet)){throw"CV1 INI default missing"}
          if(-not(Select-String MW3VR_alpha02_outproc\mw3vr.ini -Pattern "CV1RuntimeWaitMs=15000" -Quiet)){throw"CV1 wait setting missing"}

      - name: Build Win32 MW3 bridge
        shell: cmd
        run: cmake -S MW3VR_alpha02_outproc -B build-plugin -A Win32 && cmake --build build-plugin --config Release --target mw3vr

      - name: Clone OpenXR SDK
        shell: cmd
        run: git clone --depth 1 --branch release-1.1.61 https://github.com/KhronosGroup/OpenXR-SDK.git openxr-sdk

      - name: Build x64 Rift CV1 OpenXR host
        shell: cmd
        run: cmake -S MW3VR_alpha02_outproc -B build-host -A x64 -DFETCHCONTENT_SOURCE_DIR_OPENXR_SDK=%CD%\openxr-sdk && cmake --build build-host --config Release --target MW3VRHost

      - name: Fetch ASI loader
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/Win32-latest/d3d9-Win32.zip" -OutFile loader.zip
          Expand-Archive loader.zip ual -Force

      - name: Package CV1 build
        shell: pwsh
        run: |
          $asi=Get-ChildItem build-plugin -Recurse -File -Filter MW3VR.asi|select -First 1
          $hostExe=Get-ChildItem build-host -Recurse -File -Filter MW3VRHost.exe|select -First 1
          $loader=Get-ChildItem ual -Recurse -File -Filter d3d9.dll|select -First 1
          if(-not$asi-or-not$hostExe-or-not$loader){throw"Package binary missing"}
          mkdir artifact\plugins -Force|Out-Null
          cp $loader.FullName artifact\d3d9.dll
          cp $hostExe.FullName artifact\MW3VRHost.exe
          cp $asi.FullName artifact\plugins\MW3VR.asi
          cp MW3VR_alpha02_outproc\mw3vr.ini artifact\plugins\mw3vr.ini
          cp MW3VR_alpha02_outproc\README.md artifact\README.md
          cp MW3VR_alpha02_outproc\THIRD_PARTY_NOTICES.md artifact\THIRD_PARTY_NOTICES.md
          @("MW3VR Alpha 0.2-CV1 native Oculus PC OpenXR","","For Oculus Rift CV1. Quest Link/Air Link is NOT used.","Connect the CV1/sensors normally and start the Oculus/Meta PC software.","ForceOculusOpenXR=1","AutoStartOculusPC=1","CV1RuntimeWaitMs=15000","","The host starts/waits for OVRService and OVRServer_x64.exe before OpenXR.","Logs: mw3vr.log and mw3vr_host.log")|Set-Content artifact\QUICKSTART.txt
          Get-FileHash artifact\d3d9.dll -Algorithm SHA256|Out-File artifact\SHA256.txt
          Get-FileHash artifact\MW3VRHost.exe -Algorithm SHA256|Out-File artifact\SHA256.txt -Append
          Get-FileHash artifact\plugins\MW3VR.asi -Algorithm SHA256|Out-File artifact\SHA256.txt -Append

      - uses: actions/upload-artifact@v4
        with:
          name: MW3VR-OpenXR-Alpha02-CV1
          path: artifact
          if-no-files-found: error
