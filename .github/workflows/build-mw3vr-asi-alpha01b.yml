name: Build MW3VR ASI Alpha 0.1c

on:
  push:
    branches: [mw3vr-asi-alpha01b]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified Alpha 0.1b source
        shell: pwsh
        run: |
          $paths = @(
            "mw3vr_asi\source_part1.b64",
            "mw3vr_asi\source_part2.b64",
            "mw3vr_asi\source_part3a.b64",
            "mw3vr_asi\source_tail01.b64",
            "mw3vr_asi\source_tail02.b64",
            "mw3vr_asi\source_tail03.b64",
            "mw3vr_asi\source_tail04.b64",
            "mw3vr_asi\source_tail05.b64",
            "mw3vr_asi\source_tail06.b64",
            "mw3vr_asi\source_tail07.b64",
            "mw3vr_asi\source_tail08.b64"
          )
          $b64 = ($paths | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("mw3vr_asi_source.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "mw3vr_asi_source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "4385670a56ef20de84c632fe37f2d956414b3e2a1faa592cc81d6e19e2cb688e") {
            throw "Source ZIP hash mismatch: $hash"
          }
          Expand-Archive "mw3vr_asi_source.zip" "." -Force

      - name: Apply Alpha 0.1c crash-safety patch
        shell: pwsh
        run: |
          $patch = (Get-Content "mw3vr_alpha01c_patch_part1.txt" -Raw) + (Get-Content "mw3vr_alpha01c_patch_part2.txt" -Raw)
          $patch = $patch.Replace("`r`n", "`n")
          Set-Content "mw3vr_alpha01c.patch" -Value $patch -NoNewline
          $hash = (Get-FileHash "mw3vr_alpha01c.patch" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "c94f4e2e16f1a6b8c226e8e9e3a5fcd62b06a6834ac63269105e45eb1dfa2395") {
            throw "Alpha 0.1c patch hash mismatch: $hash"
          }
          Push-Location MW3VR_ASI
          git apply "..\mw3vr_alpha01c.patch"
          Pop-Location
          if (-not (Select-String "MW3VR_ASI\src\asi_entry.cpp" "alpha 0.1c" -Quiet)) { throw "0.1c version marker missing." }
          if (-not (Select-String "MW3VR_ASI\mw3vr.ini" "NativeHeadTracking=0" -Quiet)) { throw "Safe native-head default missing." }

      - name: Force MW3VR target to dynamic MSVC CRT
        shell: pwsh
        run: |
          $path = "MW3VR_ASI\CMakeLists.txt"
          $text = Get-Content $path -Raw
          $needle = 'target_include_directories(mw3vr PRIVATE src)'
          $force = 'set_property(TARGET mw3vr PROPERTY MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>DLL")'
          if (-not $text.Contains($needle)) { throw "MW3VR target marker not found." }
          if (-not $text.Contains($force)) {
            $text = $text.Replace($needle, $force + "`r`n`r`n" + $needle)
            Set-Content $path -Value $text -NoNewline
          }
          if (-not (Select-String $path 'set_property\(TARGET mw3vr PROPERTY MSVC_RUNTIME_LIBRARY' -Quiet)) {
            throw "Target CRT override was not installed."
          }

      - name: Clone Khronos OpenXR SDK 1.1.61
        shell: cmd
        run: git clone --depth 1 --branch release-1.1.61 https://github.com/KhronosGroup/OpenXR-SDK.git openxr-sdk

      - name: Configure Win32 Release
        shell: cmd
        run: cmake -S MW3VR_ASI -B build-mw3vr-asi -A Win32 -DFETCHCONTENT_SOURCE_DIR_OPENXR_SDK=%CD%\openxr-sdk

      - name: Verify generated CRT
        shell: pwsh
        run: |
          $proj = Get-Content "build-mw3vr-asi\mw3vr.vcxproj" -Raw
          if ($proj -notmatch '<RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>') {
            throw "MW3VR Release project is not using /MD."
          }
          Write-Host "Verified MW3VR Release runtime: /MD"

      - name: Build MW3VR ASI
        shell: cmd
        run: cmake --build build-mw3vr-asi --config Release --target mw3vr

      - name: Fetch Ultimate ASI Loader Win32 D3D9
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/Win32-latest/d3d9-Win32.zip" -OutFile "d3d9-Win32.zip"
          Expand-Archive "d3d9-Win32.zip" "ual" -Force
          if (-not (Get-ChildItem "ual" -Recurse -File -Filter "d3d9.dll" | Select-Object -First 1)) {
            throw "Ultimate ASI Loader d3d9.dll not found."
          }

      - name: Package build
        shell: pwsh
        run: |
          $asi = Get-ChildItem "build-mw3vr-asi" -Recurse -File -Filter "MW3VR.asi" | Select-Object -First 1
          $loader = Get-ChildItem "ual" -Recurse -File -Filter "d3d9.dll" | Select-Object -First 1
          if (-not $asi -or -not $loader) { throw "Build output or loader missing." }
          New-Item -ItemType Directory -Force "artifact\plugins" | Out-Null
          Copy-Item $loader.FullName "artifact\d3d9.dll"
          Copy-Item $asi.FullName "artifact\plugins\MW3VR.asi"
          Copy-Item "MW3VR_ASI\mw3vr.ini" "artifact\plugins\mw3vr.ini"
          Copy-Item "MW3VR_ASI\README.md" "artifact\README.md"
          Copy-Item "MW3VR_ASI\THIRD_PARTY_NOTICES.md" "artifact\THIRD_PARTY_NOTICES.md"
          @"
          MW3VR OpenXR Alpha 0.1c - crash-safety build

          Replace the Alpha 0.1b files with this package.

          Layout:
            iw5sp.exe
            d3d9.dll
            plugins\MW3VR.asi
            plugins\mw3vr.ini

          Safety changes:
          - reads plugins\mw3vr.ini correctly
          - NativeHeadTracking=0 by default
          - 5-second VR startup delay
          - Present fallback hooks disabled by default
          - VR callback SEH containment
          "@ | Set-Content "artifact\QUICKSTART.txt"
          Get-FileHash "artifact\d3d9.dll" -Algorithm SHA256 | Out-File "artifact\SHA256.txt"
          Get-FileHash "artifact\plugins\MW3VR.asi" -Algorithm SHA256 | Out-File "artifact\SHA256.txt" -Append

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: MW3VR-OpenXR-Alpha01c-ASI-Win32
          path: artifact
          if-no-files-found: error
