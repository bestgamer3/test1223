name: Build MW3VR ASI Alpha 0.1b

on:
  push:
    branches:
      - mw3vr-asi-alpha01b
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $paths = @(
            "mw3vr_asi\source_part1.b64",
            "mw3vr_asi\source_part2.b64",
            "mw3vr_asi\source_part3a.b64",
            "mw3vr_asi\source_part3b.b64",
            "mw3vr_asi\source_part3c.b64"
          )
          $expectedLengths = @(13000, 13000, 4000, 4000, 3888)
          $expectedHashes = @(
            "2cb85e415fa9e0d4c018b56651fa09cd7b09b6f8a266cf7f39963ebf23074aa9",
            "4648d887105b9f4b9ed498aba9454aeb1c725646f9179e3a52df9366bc617d23",
            "48dccd23dbbf8429d5016e600a1b652f329ea6f757bb63ae47eea5b2688716ee",
            "ff4605090c61cfc4054eddecbaa741efe6b73097e80e798e9006782b02aa8204",
            "2114279c6a472309d9d176021244153c207f8f37b63f44f8d1e5ff349e5b92c5"
          )
          $chunks = @()
          for ($i = 0; $i -lt $paths.Count; $i++) {
            if (-not (Test-Path $paths[$i])) { throw "Missing source chunk $($paths[$i])." }
            $raw = (Get-Content $paths[$i] -Raw).Trim()
            $bytes = [Text.Encoding]::ASCII.GetBytes($raw)
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              $partHash = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace("-", "").ToLowerInvariant()
            } finally {
              $sha.Dispose()
            }
            Write-Host "Part $($i+1): length=$($raw.Length) sha256=$partHash"
            if ($raw.Length -ne $expectedLengths[$i] -or $partHash -ne $expectedHashes[$i]) {
              throw "Source part $($i+1) integrity mismatch."
            }
            $chunks += $raw
          }
          $b64 = $chunks -join ""
          [IO.File]::WriteAllBytes("mw3vr_asi_source.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "mw3vr_asi_source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "4385670a56ef20de84c632fe37f2d956414b3e2a1faa592cc81d6e19e2cb688e") {
            throw "Source ZIP hash mismatch: $hash"
          }
          Expand-Archive -Path "mw3vr_asi_source.zip" -DestinationPath "." -Force

      - name: Configure Win32 Release
        shell: cmd
        run: cmake -S MW3VR_ASI -B build-mw3vr-asi -A Win32

      - name: Build MW3VR ASI
        shell: cmd
        run: cmake --build build-mw3vr-asi --config Release --target mw3vr

      - name: Fetch Ultimate ASI Loader Win32 D3D9
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/Win32-latest/d3d9-Win32.zip" -OutFile "d3d9-Win32.zip"
          Expand-Archive -Path "d3d9-Win32.zip" -DestinationPath "ual" -Force
          $loader = Get-ChildItem "ual" -Recurse -File -Filter "d3d9.dll" | Select-Object -First 1
          if (-not $loader) { throw "Ultimate ASI Loader d3d9.dll was not found." }
          Write-Host "Using ASI loader: $($loader.FullName)"

      - name: Package build
        shell: pwsh
        run: |
          $asi = Get-ChildItem "build-mw3vr-asi" -Recurse -File -Filter "MW3VR.asi" | Select-Object -First 1
          if (-not $asi) { throw "MW3VR.asi was not found after build." }
          $loader = Get-ChildItem "ual" -Recurse -File -Filter "d3d9.dll" | Select-Object -First 1
          if (-not $loader) { throw "d3d9.dll loader was not found." }

          New-Item -ItemType Directory -Force "artifact\plugins" | Out-Null
          Copy-Item $loader.FullName "artifact\d3d9.dll"
          Copy-Item $asi.FullName "artifact\plugins\MW3VR.asi"
          Copy-Item "MW3VR_ASI\mw3vr.ini" "artifact\plugins\mw3vr.ini"
          Copy-Item "MW3VR_ASI\README.md" "artifact\README.md"
          Copy-Item "MW3VR_ASI\THIRD_PARTY_NOTICES.md" "artifact\THIRD_PARTY_NOTICES.md"

          @"
          MW3VR OpenXR Alpha 0.1b - ASI Loader Build

          IMPORTANT: REMOVE the previous MW3VR custom d3d9.dll and root mw3vr.ini first.

          Extract this package directly into the folder containing iw5sp.exe.

          Expected layout:
            iw5sp.exe
            d3d9.dll              <- Ultimate ASI Loader (Win32)
            plugins\MW3VR.asi     <- MW3VR plugin
            plugins\mw3vr.ini    <- MW3VR config

          Start Steam and your OpenXR runtime, then launch MW3 Single Player.

          A successful early startup should create mw3vr.log beside iw5sp.exe with lines similar to:
            ASI host: pid=... exe=...iw5sp.exe
            ASI: patched iw5sp Direct3DCreate9 IAT ...
            MW3VR ASI alpha 0.1b loaded. D3D9 IAT hook=1
            ASI: Direct3DCreate9 intercepted ...

          F8 recenters head orientation once OpenXR tracking is active.
          Single-player only. Do not use this with multiplayer/anti-cheat clients.
          "@ | Set-Content "artifact\QUICKSTART.txt"

          Get-FileHash "artifact\d3d9.dll" -Algorithm SHA256 | Out-File "artifact\SHA256.txt"
          Get-FileHash "artifact\plugins\MW3VR.asi" -Algorithm SHA256 | Out-File "artifact\SHA256.txt" -Append

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: MW3VR-OpenXR-Alpha01b-ASI-Win32
          path: artifact
          if-no-files-found: error
