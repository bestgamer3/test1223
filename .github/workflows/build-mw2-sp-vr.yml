name: Build MW2 Campaign VR Phase 3B Viewmodel Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mw2-sp-vr.yml'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone MW2 VR source
        shell: cmd
        run: git clone --depth 1 --branch mw2-vr-build https://github.com/bestgamer3/bestgamer3.git source

      - name: Configure x64 MW2 Campaign VR companion
        shell: cmd
        run: cmake -S source\sp_vr -B build64 -A x64

      - name: Build x64 MW2 Campaign VR companion
        shell: cmd
        run: cmake --build build64 --config Release --target MW2CampaignVR

      - name: Configure Win32 viewmodel transform DLL
        shell: cmd
        run: cmake -S source\sp_vr\viewmodel_hook -B build32 -A Win32

      - name: Build Win32 viewmodel transform DLL
        shell: cmd
        run: cmake --build build32 --config Release --target MW2VRViewmodelHook

      - name: Collect compiled files and viewmodel source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          New-Item -ItemType Directory -Force artifact\ViewmodelSource | Out-Null

          $exe = Get-ChildItem build64 -Recurse -Filter MW2CampaignVR.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw 'MW2CampaignVR.exe not found after x64 build' }
          $loader = Get-ChildItem $exe.Directory.FullName -Filter openxr_loader.dll | Select-Object -First 1
          if (-not $loader) { throw 'openxr_loader.dll not found beside MW2CampaignVR.exe' }

          $hook = Get-ChildItem build32 -Recurse -Filter MW2VRViewmodelHook.dll | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $hook) { throw 'MW2VRViewmodelHook.dll not found after Win32 build' }

          Copy-Item $exe.FullName artifact\MW2CampaignVR.exe
          Copy-Item $loader.FullName artifact\openxr_loader.dll
          Copy-Item $hook.FullName artifact\MW2VRViewmodelHook.dll
          Copy-Item source\sp_vr\README.md artifact\README.md

          Copy-Item source\sp_vr\src\VRWeaponViewmodel.hpp artifact\ViewmodelSource\VRWeaponViewmodel.hpp
          Copy-Item source\sp_vr\src\VRWeaponViewmodel.cpp artifact\ViewmodelSource\VRWeaponViewmodel.cpp
          Copy-Item source\sp_vr\src\VRViewmodelProtocol.hpp artifact\ViewmodelSource\VRViewmodelProtocol.hpp
          Copy-Item source\sp_vr\src\VRViewmodelBridge.hpp artifact\ViewmodelSource\VRViewmodelBridge.hpp
          Copy-Item source\sp_vr\src\VRViewmodelBridge.cpp artifact\ViewmodelSource\VRViewmodelBridge.cpp
          Copy-Item source\sp_vr\viewmodel_hook\MW2VRViewmodelHook.cpp artifact\ViewmodelSource\MW2VRViewmodelHook.cpp

          @"
          MW2 Campaign VR Phase 3B - Controller Weapon Viewmodel Core
          Targets Call of Duty: Modern Warfare 2 (2009) single-player: iw4sp.exe

          WHAT IS NEW
          - COD4-VR-style right-controller rigid weapon pose solver.
          - Right semantic aim pose controls weapon orientation.
          - Right grip controls weapon position.
          - Left grip + squeeze can stabilize long guns with a smooth two-hand axis.
          - ADS/two-hand state blends hip and shouldered weapon calibration.
          - x64 companion publishes the completed weapon pose through a versioned cross-bitness shared-memory packet.
          - Win32 MW2VRViewmodelHook.dll contains the in-process weapon placement transform.
          - The confirmed Phase 2B Rift optical-center eye renderer is unchanged.

          CURRENT INTEGRATION STATUS
          MW2VRViewmodelHook.dll is the safe Win32 transform core. It exports:
            MW2VR_ApplyWeaponPlacement
            MW2VR_HasViewmodelPose
            MW2VR_ResetWeaponBaselines

          It intentionally does NOT contain a guessed stock-iw4sp.exe detour address yet.
          The exact single-player viewmodel placement call still needs a verified hook/signature before the DLL can move the visible stock gun automatically. This avoids writing to an unverified campaign address and crashing the game.

          Companion controls:
          F5  = toggle physical viewmodel pose publishing
          F6  = flip rotational head/controller yaw direction
          F7  = flip physical left/right 6DoF lean direction
          F8  = recenter headset/controller reference
          F9  = toggle head-look
          F10 = toggle 6DoF translation
          F12 = close VR companion

          Touch controls:
          Right controller aim/grip = weapon pose source
          Left grip + squeeze       = two-hand foregrip stabilization
          Right trigger             = fire
          Left trigger              = ADS / shouldered blend
          Left stick                = movement
          X                         = reload
          A                         = jump

          Optional global weapon calibration examples:
          MW2CampaignVR.exe --weapon-forward-cm 3 --weapon-up-cm -2 --weapon-pitch 5
          MW2CampaignVR.exe --shoulder-forward-cm 1 --shoulder-up-cm 0 --shoulder-pitch 0

          ViewmodelSource contains the complete Phase 3B controller/viewmodel code.
          "@ | Set-Content artifact\QUICKSTART.txt

      - name: Upload MW2 Campaign VR Phase 3B build
        uses: actions/upload-artifact@v4
        with:
          name: MW2-Campaign-VR-Phase3B-ViewmodelCore-Win64-Win32Hook
          path: artifact
          if-no-files-found: error
