name: Build MW2 Campaign VR Phase 3D Final All-Viewmodel Hook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mw2-sp-vr.yml'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone MW2 VR source
        shell: cmd
        run: git clone --depth 1 --branch mw2-vr-build https://github.com/bestgamer3/bestgamer3.git source

      - name: Configure x64 MW2 Campaign VR companion
        shell: cmd
        run: cmake -S source\sp_vr -B build64 -A x64

      - name: Build x64 MW2 Campaign VR companion
        shell: cmd
        run: cmake --build build64 --config Release --target MW2CampaignVR

      - name: Configure Win32 final viewmodel hook
        shell: cmd
        run: cmake -S source\sp_vr\viewmodel_hook -B build32hook -A Win32

      - name: Build Win32 final viewmodel hook
        shell: cmd
        run: cmake --build build32hook --config Release --target MW2VRViewmodelHook

      - name: Configure Win32 hook loader
        shell: cmd
        run: cmake -S source\sp_vr\hook_loader -B build32loader -A Win32

      - name: Build Win32 hook loader
        shell: cmd
        run: cmake --build build32loader --config Release --target MW2VRHookLoader

      - name: Collect compiled files and hook source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          New-Item -ItemType Directory -Force artifact\ViewmodelSource | Out-Null

          $exe = Get-ChildItem build64 -Recurse -Filter MW2CampaignVR.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw 'MW2CampaignVR.exe not found after x64 build' }
          $openxr = Get-ChildItem $exe.Directory.FullName -Filter openxr_loader.dll | Select-Object -First 1
          if (-not $openxr) { throw 'openxr_loader.dll not found beside MW2CampaignVR.exe' }

          $hook = Get-ChildItem build32hook -Recurse -Filter MW2VRViewmodelHook.dll | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $hook) { throw 'MW2VRViewmodelHook.dll not found after Win32 build' }

          $hookLoader = Get-ChildItem build32loader -Recurse -Filter MW2VRHookLoader.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $hookLoader) { throw 'MW2VRHookLoader.exe not found after Win32 build' }

          Copy-Item $exe.FullName artifact\MW2CampaignVR.exe
          Copy-Item $openxr.FullName artifact\openxr_loader.dll
          Copy-Item $hook.FullName artifact\MW2VRViewmodelHook.dll
          Copy-Item $hookLoader.FullName artifact\MW2VRHookLoader.exe
          Copy-Item source\sp_vr\README.md artifact\README.md

          Copy-Item source\sp_vr\src\VRWeaponViewmodel.hpp artifact\ViewmodelSource\VRWeaponViewmodel.hpp
          Copy-Item source\sp_vr\src\VRWeaponViewmodel.cpp artifact\ViewmodelSource\VRWeaponViewmodel.cpp
          Copy-Item source\sp_vr\src\VRViewmodelProtocol.hpp artifact\ViewmodelSource\VRViewmodelProtocol.hpp
          Copy-Item source\sp_vr\src\VRViewmodelBridge.hpp artifact\ViewmodelSource\VRViewmodelBridge.hpp
          Copy-Item source\sp_vr\src\VRViewmodelBridge.cpp artifact\ViewmodelSource\VRViewmodelBridge.cpp
          Copy-Item source\sp_vr\viewmodel_hook\MW2VRFinalViewmodelPlacement.cpp artifact\ViewmodelSource\MW2VRFinalViewmodelPlacement.cpp
          Copy-Item source\sp_vr\viewmodel_hook\MW2VRLiveHook.cpp artifact\ViewmodelSource\MW2VRLiveHook.cpp
          Copy-Item source\sp_vr\viewmodel_hook\MW2VRViewmodelHook.def artifact\ViewmodelSource\MW2VRViewmodelHook.def
          Copy-Item source\sp_vr\hook_loader\MW2VRHookLoader.cpp artifact\ViewmodelSource\MW2VRHookLoader.cpp

          @"
          @echo off
          cd /d "%~dp0"
          start "MW2 Campaign VR" MW2CampaignVR.exe
          MW2VRHookLoader.exe
          if errorlevel 1 (
            echo.
            echo The live viewmodel hook did not install.
            echo Check MW2VRViewmodelHook.log in this folder.
            pause
          )
          "@ | Set-Content artifact\START_MW2_VR_WITH_WEAPON_HOOK.bat

          @"
          MW2 Campaign VR Phase 3D - FINAL GLOBAL VR VIEWMODEL HOOK
          Targets Call of Duty: Modern Warfare 2 (2009) single-player iw4sp.exe only.

          QUICK START
          1. Put all files beside your legitimate Steam iw4sp.exe.
          2. Start the Oculus/Meta OpenXR runtime and connect the Rift CV1 + Touch controllers.
          3. Run START_MW2_VR_WITH_WEAPON_HOOK.bat.
          4. The x64 companion starts/attaches to MW2 and publishes controller tracking.
          5. The Win32 loader loads MW2VRViewmodelHook.dll and installs the verified single-player viewmodel call hook.

          WHAT THIS FINAL HOOK DOES
          - Hooks the shared first-person CG_AddViewWeapon -> CG_AddPlayerWeapon submission path, not individual weapon files.
          - Therefore every normal first-person viewmodel that passes through that MW2 path is routed through the VR controller transform: rifles, pistols, SMGs, LMGs, shotguns, sniper rifles, launchers and scripted variants that use the same viewmodel submission.
          - Keeps MW2's original weapon DObj/models, reloads, firing animations, bolt/magazine animation and effects. The final root pose is replaced by our tracked VR root instead of replacing proprietary game assets.
          - Learns separate attachment profiles as MW2 changes to a genuinely different stock viewmodel root, so the first gun's cached root is not reused forever.
          - Reuses a learned profile when a sufficiently matching viewmodel root returns.
          - Filters short recoil/root spikes and excludes ADS from gradual weapon-profile learning because ADS already uses the explicit shouldered VR blend.
          - Left squeeze still provides two-hand support orientation from the tracked left Touch controller.

          SAFE RETAIL-SP LOCATOR
          - No multiplayer function address is hard-coded.
          - The DLL locates cg_drawGun plus cg_gun_x/y/z through their runtime dvar registration references.
          - It finds the code region reading all four dvars, matching the single-player CG_AddViewWeapon path.
          - It requires exactly one relative CALL with five cdecl arguments (20-byte caller cleanup) after the gun-offset code.
          - Only that validated call is redirected. If validation is ambiguous, the DLL refuses to patch and leaves stock code untouched.
          - Camera origin/axis use the same high-confidence refdef structural validation used by the existing 6DoF code.

          EXPECTED RESULT
          Once the hook and gameplay camera are active, moving/rotating the right Touch controller moves/rotates the actual MW2 first-person weapon viewmodel. Switching campaign weapons should remain VR-driven and automatically learn/reuse suitable root attachments.

          IMPORTANT
          This is a source-built mod helper for a legitimate copy of MW2. It does not contain or replace iw4sp.exe or any proprietary MW2 model assets. Runtime validation must still match your exact Steam executable; a mismatch fails closed and writes MW2VRViewmodelHook.log.

          Controls:
          F5  = toggle physical viewmodel pose publishing
          F6  = flip rotational head/controller yaw fallback direction
          F7  = flip physical left/right 6DoF lean direction
          F8  = recenter headset/controller reference
          F9  = toggle head-look
          F10 = toggle 6DoF translation
          F12 = close VR companion

          Touch:
          Right aim/grip       = weapon pose source
          Left grip + squeeze = two-hand support orientation
          Right trigger        = fire
          Left trigger         = ADS / shouldered blend
          Left stick           = movement
          X                    = reload
          A                    = jump

          If the loader says validation failed, open MW2VRViewmodelHook.log. The hook intentionally does not guess when the executable layout is different.
          "@ | Set-Content artifact\QUICKSTART.txt

      - name: Upload MW2 Campaign VR Phase 3D build
        uses: actions/upload-artifact@v4
        with:
          name: MW2-Campaign-VR-Phase3D-Final-AllViewmodels-Win64-Win32
          path: artifact
          if-no-files-found: error
