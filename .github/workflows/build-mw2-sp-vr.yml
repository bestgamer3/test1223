name: Build MW2 Campaign VR Phase 3E Weapon-Only Viewmodel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mw2-sp-vr.yml'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone MW2 VR source
        shell: cmd
        run: git clone --depth 1 --branch mw2-vr-build https://github.com/bestgamer3/bestgamer3.git source

      - name: Configure x64 MW2 Campaign VR companion
        shell: cmd
        run: cmake -S source\sp_vr -B build64 -A x64

      - name: Build x64 MW2 Campaign VR companion
        shell: cmd
        run: cmake --build build64 --config Release --target MW2CampaignVR

      - name: Configure Win32 weapon-only viewmodel hook
        shell: cmd
        run: cmake -S source\sp_vr\viewmodel_hook -B build32hook -A Win32

      - name: Build Win32 weapon-only viewmodel hook
        shell: cmd
        run: cmake --build build32hook --config Release --target MW2VRViewmodelHook

      - name: Configure Win32 hook loader
        shell: cmd
        run: cmake -S source\sp_vr\hook_loader -B build32loader -A Win32

      - name: Build Win32 hook loader
        shell: cmd
        run: cmake --build build32loader --config Release --target MW2VRHookLoader

      - name: Collect compiled files and hook source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          New-Item -ItemType Directory -Force artifact\ViewmodelSource | Out-Null

          $exe = Get-ChildItem build64 -Recurse -Filter MW2CampaignVR.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw 'MW2CampaignVR.exe not found after x64 build' }
          $openxr = Get-ChildItem $exe.Directory.FullName -Filter openxr_loader.dll | Select-Object -First 1
          if (-not $openxr) { throw 'openxr_loader.dll not found beside MW2CampaignVR.exe' }

          $hook = Get-ChildItem build32hook -Recurse -Filter MW2VRViewmodelHook.dll | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $hook) { throw 'MW2VRViewmodelHook.dll not found after Win32 build' }

          $hookLoader = Get-ChildItem build32loader -Recurse -Filter MW2VRHookLoader.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $hookLoader) { throw 'MW2VRHookLoader.exe not found after Win32 build' }

          Copy-Item $exe.FullName artifact\MW2CampaignVR.exe
          Copy-Item $openxr.FullName artifact\openxr_loader.dll
          Copy-Item $hook.FullName artifact\MW2VRViewmodelHook.dll
          Copy-Item $hookLoader.FullName artifact\MW2VRHookLoader.exe
          Copy-Item source\sp_vr\README.md artifact\README.md

          Copy-Item source\sp_vr\src\VRWeaponViewmodel.hpp artifact\ViewmodelSource\VRWeaponViewmodel.hpp
          Copy-Item source\sp_vr\src\VRWeaponViewmodel.cpp artifact\ViewmodelSource\VRWeaponViewmodel.cpp
          Copy-Item source\sp_vr\src\VRViewmodelProtocol.hpp artifact\ViewmodelSource\VRViewmodelProtocol.hpp
          Copy-Item source\sp_vr\src\VRViewmodelBridge.hpp artifact\ViewmodelSource\VRViewmodelBridge.hpp
          Copy-Item source\sp_vr\src\VRViewmodelBridge.cpp artifact\ViewmodelSource\VRViewmodelBridge.cpp
          Copy-Item source\sp_vr\viewmodel_hook\MW2VRFinalViewmodelPlacement.cpp artifact\ViewmodelSource\MW2VRFinalViewmodelPlacement.cpp
          Copy-Item source\sp_vr\viewmodel_hook\MW2VRLiveHook.cpp artifact\ViewmodelSource\MW2VRLiveHook.cpp
          Copy-Item source\sp_vr\viewmodel_hook\MW2VRHandsFilter.cpp artifact\ViewmodelSource\MW2VRHandsFilter.cpp
          Copy-Item source\sp_vr\viewmodel_hook\MW2VRViewmodelHook.def artifact\ViewmodelSource\MW2VRViewmodelHook.def
          Copy-Item source\sp_vr\hook_loader\MW2VRHookLoader.cpp artifact\ViewmodelSource\MW2VRHookLoader.cpp

          @"
          @echo off
          cd /d "%~dp0"
          start "MW2 Campaign VR" MW2CampaignVR.exe
          MW2VRHookLoader.exe
          if errorlevel 1 (
            echo.
            echo The weapon-only VR viewmodel hooks did not install.
            echo Check MW2VRViewmodelHook.log in this folder.
            pause
          )
          "@ | Set-Content artifact\START_MW2_VR_WITH_WEAPON_HOOK.bat

          @"
          MW2 Campaign VR Phase 3E - WEAPON-ONLY VR VIEWMODEL
          Targets Call of Duty: Modern Warfare 2 (2009) single-player iw4sp.exe only.

          QUICK START
          1. Put all files beside your legitimate Steam iw4sp.exe.
          2. Start the Oculus/Meta OpenXR runtime and connect the Rift CV1 + Touch controllers.
          3. Fully restart MW2 before testing this build; do not inject it over an older Phase 3D session.
          4. Run START_MW2_VR_WITH_WEAPON_HOOK.bat.
          5. The loader installs the hand/arm filter FIRST, then the tracked weapon-placement hook.

          WHAT CHANGED FROM PHASE 3D
          - Phase 3D moved MW2's entire flat-screen first-person rig, including the canned two-hand pose.
          - Phase 3E inspects the actual first-person weapon DObj and identifies attached hand/arm XModels by model name.
          - It validates every model pointer and verifies that the sum of submodel bone counts exactly matches the DObj bone count before changing anything.
          - It hides only the bone ranges belonging to hand/arm/glove submodels by OR-ing those bits into IW4's existing hidePartBits mask.
          - The weapon submodel stays visible and continues using MW2's normal firing, reload, magazine, bolt, scope and attachment animation data.
          - The remaining weapon root is still driven by the right Touch controller through the existing Phase 3D placement solver.
          - F5 disabling physical viewmodel publishing restores the saved stock hide mask when that DObj is next processed.

          INSTALL ORDER / SAFETY
          - The hand filter is installed before the outer CG_AddPlayerWeapon placement hook so it can inspect the unmodified first-person function.
          - No multiplayer address is hard-coded.
          - The outer call is still located through cg_drawGun plus cg_gun_x/y/z runtime references.
          - The inner DObj getter is selected only from two-argument cdecl calls inside that verified first-person function.
          - Even after interception, no DObj memory is modified unless the returned pointer passes strict layout, memory, model-name and total-bone validation and contains both a hand-like model and a non-hand weapon model.
          - Validation failure leaves the stock viewmodel untouched and writes diagnostics to MW2VRViewmodelHook.log.

          EXPECTED RESULT
          The canned MW2 two-handed FPS arms should disappear while the actual MW2 gun remains visible and follows the tracked right Touch controller in 6DoF. This phase intentionally produces a weapon-only VR viewmodel; independent tracked glove/arm IK is a separate next stage.

          Controls:
          F5  = toggle physical viewmodel pose publishing / hand filtering
          F6  = flip rotational head/controller yaw fallback direction
          F7  = flip physical left/right 6DoF lean direction
          F8  = recenter headset/controller reference
          F9  = toggle head-look
          F10 = toggle 6DoF translation
          F12 = close VR companion

          Touch:
          Right aim/grip       = weapon pose source
          Left grip + squeeze = two-hand aiming stabilization (does not render the old canned left arm)
          Right trigger        = fire
          Left trigger         = ADS / shouldered blend
          Left stick           = movement
          X                    = reload
          A                    = jump

          Useful log lines:
          [MW2VR][HANDS] WEAPON-ONLY FILTER INSTALLED
          [MW2VR][HANDS] weapon-only VR filter active
          [MW2VR][HANDS] model[...] '...' ... HIDDEN (stock FPS hand/arm)

          If the gun still shows baked arms, send MW2VRViewmodelHook.log. It will show whether the inner DObj getter or the exact MW2 hand-model naming needs a signature/name adjustment for your Steam executable.
          "@ | Set-Content artifact\QUICKSTART.txt

      - name: Upload MW2 Campaign VR Phase 3E build
        uses: actions/upload-artifact@v4
        with:
          name: MW2-Campaign-VR-Phase3E-WeaponOnly-Win64-Win32
          path: artifact
          if-no-files-found: error
